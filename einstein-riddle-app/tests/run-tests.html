<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Einstein tests</title>
</head>
<body>
  <h1>Tests</h1>
  <pre id="out"></pre>
  <script type="module">
    import {
      CATEGORIES, VALUES, FALLBACK_ANSWER, FALLBACK_CLUES, HOUSES, DIFFICULTY_TARGETS,
      DIFFICULTY_PROFILES, PROFILE_FALLBACKS,
    } from "../js/puzzle-data.js";
    import { countWrong, isComplete, grade } from "../js/validate.js";
    import { createGameState } from "../js/state.js";
    import {
      SOLVER_ABORTED, answerSatisfiesClues, countSolutions, isUniqueSolution,
    } from "../js/solver.js";
    import { generatePuzzle } from "../js/generate.js";
    import { buildHints, validateHints } from "../js/hints.js";
    import { bindTeacherPanel } from "../js/teacher.js";
    import { createDragDrop } from "../js/drag-drop.js";

    const out = document.getElementById("out");
    let failed = 0;
    function assert(cond, msg) {
      out.textContent += (cond ? "ok: " : "FAIL: ") + msg + "\n";
      if (!cond) failed++;
    }

    const expectedProfiles = {
      easy: { houseCount: 4, categories: ["color", "nation", "drink", "food"] },
      normal: { houseCount: 4, categories: ["color", "nation", "drink", "food", "animal"] },
      hard: { houseCount: 5, categories: CATEGORIES },
      expert: { houseCount: 5, categories: CATEGORIES },
    };
    for (const [id, expected] of Object.entries(expectedProfiles)) {
      assert(DIFFICULTY_PROFILES[id].houseCount === expected.houseCount, `${id} house count`);
      assert(
        JSON.stringify(DIFFICULTY_PROFILES[id].categories) === JSON.stringify(expected.categories),
        `${id} categories`,
      );
    }
    assert(
      countSolutions([], {
        limit: 2,
        houseCount: 4,
        categories: ["color"],
        values: { color: ["yellow", "blue", "red", "green"] },
      }) === 2,
      "variable solver supports 4 houses",
    );

    assert(HOUSES.length === 5, "5 houses");
    assert(CATEGORIES.length === 5, "5 categories");
    for (const cat of CATEGORIES) {
      assert(VALUES[cat].length === 5, cat + " has 5 values");
      assert(FALLBACK_ANSWER[cat].length === 5, cat + " answer length");
      assert(new Set(FALLBACK_ANSWER[cat]).size === 5, cat + " answer unique");
    }
    assert(FALLBACK_CLUES.length === 15, "fallback 15 clues");
    assert(DIFFICULTY_TARGETS.easy.min === 12, "easy min");
    assert(DIFFICULTY_TARGETS.hard.max === 11, "hard max");
    assert(countSolutions([], { limit: 2 }) === 2, "no clues reach solution limit");
    assert(isUniqueSolution(FALLBACK_CLUES), "fallback clues have one solution");
    assert(answerSatisfiesClues(FALLBACK_ANSWER, FALLBACK_CLUES), "fallback answer satisfies clues");
    let abortChecks = 0;
    assert(
      countSolutions([], {
        limit: 2,
        shouldAbort: () => ++abortChecks >= 10,
      }) === SOLVER_ABORTED,
      "solver cancellation is explicit",
    );
    const unknownClue = { kind: "unknown", cat: "nation", val: "norway" };
    const malformedClue = { kind: "atHouse", cat: "nation", val: "unknown", houseIndex: 0 };
    assert(countSolutions([unknownClue]) === 0, "unknown clue fails closed");
    assert(!isUniqueSolution([unknownClue]), "unknown clue is not unique");
    assert(!answerSatisfiesClues(FALLBACK_ANSWER, [unknownClue]), "unknown clue fails answer validation");
    assert(countSolutions([malformedClue]) === 0, "malformed clue fails closed");

    const empty = Object.fromEntries(CATEGORIES.map((c) => [c, [null, null, null, null, null]]));
    assert(isComplete(empty) === false, "empty incomplete");
    assert(countWrong(FALLBACK_ANSWER, FALLBACK_ANSWER) === 0, "answer has 0 wrong");
    assert(grade(FALLBACK_ANSWER, FALLBACK_ANSWER).solved === true, "answer solved");

    const oneWrong = structuredClone(FALLBACK_ANSWER);
    oneWrong.animal[3] = "dog";
    assert(countWrong(oneWrong, FALLBACK_ANSWER) >= 1, "tampered answer has wrong cells");

    const g = createGameState();
    g.loadPuzzle({ answer: FALLBACK_ANSWER, clues: FALLBACK_CLUES, difficulty: "easy" });
    assert(g.getDifficulty() === "easy", "default easy");
    assert(g.getClues().length === 15, "fallback 15 clues");
    assert(g.getAnswer().nation[0] === "norway", "fallback norway house1");

    const placed = g.moveCard({
      value: "norway",
      category: "nation",
      from: { type: "pool" },
      to: { type: "slot", houseIndex: 0, category: "nation" },
    });
    assert(placed === true, "move to empty slot");
    assert(g.getPlacement().nation[0] === "norway", "norway in house1");
    assert(g.canUndo() === true, "can undo");
    g.undo();
    assert(g.getPlacement().nation[0] == null, "undone");

    function puzzleSolverOptions(puzzle) {
      return {
        houseCount: puzzle.houseCount,
        categories: puzzle.categories,
        values: puzzle.values,
      };
    }

    for (const id of ["easy", "normal", "hard", "expert"]) {
      const puzzle = generatePuzzle(id, { timeLimitMs: 2500 });
      const profile = DIFFICULTY_PROFILES[id];
      assert(puzzle.houseCount === profile.houseCount, `${id} generated house count`);
      assert(
        JSON.stringify(puzzle.categories) === JSON.stringify(profile.categories),
        `${id} categories`,
      );
      assert(isUniqueSolution(puzzle.clues, puzzleSolverOptions(puzzle)), `${id} unique`);
      assert(
        answerSatisfiesClues(puzzle.answer, puzzle.clues, puzzleSolverOptions(puzzle)),
        `${id} answer satisfies clues`,
      );
      assert(Array.isArray(puzzle.hints) && puzzle.hints.length >= 6, `${id} has multiple hint bundles`);
      assert(puzzle.difficulty === id, `${id} difficulty field`);
      assert(
        validateHints({
          hints: puzzle.hints,
          clues: puzzle.clues,
          answer: puzzle.answer,
          houseCount: puzzle.houseCount,
          categories: puzzle.categories,
        }),
        `${id} hints validate against answer and clue indices`,
      );
      assert(new Set(puzzle.hints.map((hint) => hint.id)).size === puzzle.hints.length, `${id} hint ids unique`);
    }

    const easyGenerated = generatePuzzle("easy", { timeLimitMs: 2500 });
    assert(!easyGenerated.categories.includes("animal"), "easy excludes animal");
    assert(!("animal" in easyGenerated.answer), "easy answer excludes animal");
    assert(Object.values(easyGenerated.values).every((row) => row.length === 4), "easy selects four values");
    assert(easyGenerated.hints.length >= 6, "easy has at least two hint bundles");
    assert(easyGenerated.hints[0].stage === "direction", "first hint direction");
    assert(easyGenerated.hints[1].stage === "clues", "second hint clue guidance");
    assert(easyGenerated.hints[2].stage === "fact", "third hint fact");
    assert(
      easyGenerated.hints[1].meta?.clueIndices?.every(
        (index) => Number.isInteger(index) && index >= 1 && index <= easyGenerated.clues.length,
      ),
      "hint clue indices are valid",
    );
    assert(
      easyGenerated.hints[2].meta?.val ===
        easyGenerated.answer[easyGenerated.hints[2].meta.cat]?.[easyGenerated.hints[2].meta.houseIndex],
      "hint fact matches answer placement",
    );

    const hardGenerated = generatePuzzle("hard", { timeLimitMs: 2500 });
    const expertGenerated = generatePuzzle("expert", { timeLimitMs: 2500 });
    assert(hardGenerated.hints.length >= 9, "hard has at least three hint bundles");
    assert(hardGenerated.meta.usedFallback || hardGenerated.clues.length === 15, "non-fallback hard has 15 clues");
    assert(
      expertGenerated.meta.usedFallback ||
        (expertGenerated.clues.length >= 12 && expertGenerated.clues.length <= 14),
      "non-fallback expert has 12-14 clues",
    );
    assert(hardGenerated.clues.length > expertGenerated.clues.length, "hard always has more clues than expert");
    assert(
      PROFILE_FALLBACKS.hard.clues.length > PROFILE_FALLBACKS.expert.clues.length,
      "hard fallback has more clues than expert fallback",
    );
    assert(
      PROFILE_FALLBACKS.expert.clues.length >= 12 &&
        PROFILE_FALLBACKS.expert.clues.length <= 14,
      "expert fallback stays within 12-14 clues",
    );

    const generated = { easy: [], hard: [] };
    for (const difficulty of ["easy", "hard"]) {
      for (let i = 0; i < 3; i++) {
        const started = Date.now();
        const puzzle = generatePuzzle(difficulty, { timeLimitMs: 2500 });
        const elapsed = Date.now() - started;
        if (!puzzle.meta.usedFallback) generated[difficulty].push(puzzle.meta.clueCount);
        assert(isUniqueSolution(puzzle.clues, puzzleSolverOptions(puzzle)), `${difficulty} puzzle ${i + 1} unique including fallback`);
        assert(
          answerSatisfiesClues(puzzle.answer, puzzle.clues, puzzleSolverOptions(puzzle)),
          `${difficulty} puzzle ${i + 1} answer satisfies clues`,
        );
        assert(elapsed < 2100, `${difficulty} puzzle ${i + 1} generated near 2s boundary`);
      }
    }
    if (generated.easy.length && generated.hard.length) {
      assert(Math.max(...generated.hard) > Math.min(...generated.easy), "non-fallback hard above easy clue count");
    }

    const timeoutStarted = Date.now();
    const timedOut = generatePuzzle("hard", { timeLimitMs: 0 });
    assert(timedOut.meta.usedFallback, "expired generator budget uses fallback");
    assert(Date.now() - timeoutStarted < 500, "expired generator budget returns promptly");
    assert(isUniqueSolution(timedOut.clues, puzzleSolverOptions(timedOut)), "fallback path remains unique");
    assert(timedOut.houseCount === 5, "hard fallback keeps profile house count");

    const expertTimeout = generatePuzzle("expert", { timeLimitMs: 0 });
    assert(expertTimeout.meta.usedFallback, "expert expired budget uses fallback");
    assert(
      expertTimeout.clues.length >= 12 && expertTimeout.clues.length <= 14,
      "expert fallback clue count in range",
    );
    assert(
      timedOut.clues.length > expertTimeout.clues.length,
      "hard fallback beats expert fallback clue count",
    );

    assert(typeof buildHints === "function", "buildHints export exists");
    assert(typeof validateHints === "function", "validateHints export exists");

    (function testTeacherPlacementRefresh() {
      const ids = [
        "teacher-panel", "btn-teacher", "btn-teacher-unlock", "teacher-pw",
        "teacher-error", "teacher-body", "teacher-login", "answer-board",
      ];
      const elements = Object.fromEntries(ids.map((id) => [id, document.createElement("div")]));
      elements["teacher-login"].classList.add("hidden");
      elements["teacher-body"].classList.add("hidden");
      const prevGet = document.getElementById.bind(document);
      document.getElementById = (id) => elements[id] ?? prevGet(id);
      try {
        let placement = Object.fromEntries(CATEGORIES.map((c) => [c, [null, null, null, null, null]]));
        const teacher = bindTeacherPanel({
          getPlacement: () => placement,
          getAnswer: () => FALLBACK_ANSWER,
        });
        elements["teacher-pw"].value = "teacher2026";
        elements["btn-teacher-unlock"].click();
        assert(elements["answer-board"].innerHTML.includes("틀린 칸(비교): 25"), "teacher empty placement wrong count");
        placement = structuredClone(FALLBACK_ANSWER);
        teacher.refresh();
        assert(elements["answer-board"].innerHTML.includes("틀린 칸(비교): 0"), "teacher refresh after full placement");
      } finally {
        document.getElementById = prevGet;
      }
    })();

    (function testDragPointerCancel() {
      let dropped = false;
      const card = document.createElement("span");
      card.className = "card";
      card.dataset.value = "norway";
      card.dataset.category = "nation";
      const root = document.createElement("div");
      root.appendChild(card);
      const pool = document.createElement("div");
      pool.id = "pool";
      const dragDrop = createDragDrop({
        boardEl: document.createElement("div"),
        poolEl: pool,
        onDrop: () => { dropped = true; },
        rootEl: root,
      });
      dragDrop.bind();
      dragDrop.handlePointerDown({
        preventDefault() {},
        target: card,
        clientX: 5,
        clientY: 6,
        pointerId: 99,
      });
      assert(dragDrop.isDragging(), "drag session active");
      dragDrop.handlePointerCancel({ pointerId: 99, clientX: 5, clientY: 6 });
      assert(!dragDrop.isDragging(), "cancel clears drag session");
      assert(!dragDrop.hasGhost(), "cancel removes ghost");
      assert(!card.classList.contains("dragging"), "cancel removes dragging class");
      assert(!dropped, "cancel keeps original state without onDrop");
    })();

    out.textContent += failed === 0 ? "\nALL PASSED\n" : `\n${failed} FAILED\n`;
  </script>
</body>
</html>
