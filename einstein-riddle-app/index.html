<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아인슈타인 추론 게임</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-main">
      <h1>아인슈타인 추론 게임</h1>
      <p class="tagline" id="tagline">단서를 읽고 집의 배치를 맞혀 보세요</p>
    </div>
    <p class="creator-credit">제작자 : 광주T 오욱재</p>
  </header>
  <main id="app">
    <section class="toolbar" id="toolbar">
      <label>난이도
        <select id="difficulty">
          <option value="easy">쉬움</option>
          <option value="normal">보통</option>
          <option value="hard">어려움</option>
          <option value="expert">매우 어려움</option>
        </select>
      </label>
      <button type="button" id="btn-new">새 문제</button>
      <div class="timer" id="timer" aria-live="polite">00:00</div>
      <button type="button" id="btn-undo" disabled>되돌리기</button>
      <button type="button" id="btn-reset">초기화</button>
      <button type="button" id="btn-submit" class="primary">제출</button>
    </section>

    <p class="help" id="help-easy">카드를 집의 칸으로 끌어다 놓고, 단서를 눌러 읽음 표시를 하세요. 힌트는 아래 버튼으로 확인할 수 있습니다.</p>

    <div class="layout">
      <aside id="clues" class="clues" aria-label="단서 목록"></aside>
      <section class="play">
        <div id="board" class="board" aria-label="집 배치판"></div>
        <div id="pool" class="pool" aria-label="카드 풀"></div>
      </section>
    </div>

    <p id="feedback" class="feedback" role="status"></p>

    <section class="hints" aria-label="힌트">
      <div class="hints-header">
        <h2>힌트</h2>
        <div class="hint-actions">
          <button type="button" id="btn-hint">힌트 보기</button>
          <button type="button" id="btn-reveal-answer">정답 보기</button>
        </div>
      </div>
      <ol id="hint-list" class="hint-list"></ol>
      <p id="hint-status" class="hint-status" aria-live="polite"></p>
    </section>
  </main>

  <div class="scale-controls" role="group" aria-label="글자 크기">
    <button type="button" id="scale-down" aria-label="글자 축소">A−</button>
    <span id="scale-value">150%</span>
    <button type="button" id="scale-up" aria-label="글자 확대">A+</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
